<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room controls · simulated QA data</title><link rel="stylesheet" href="../home-screens.css?v=13"><style>body{margin:0;background:#101c2e;color:#eef5ff;font:14px system-ui}button{cursor:pointer}dialog{margin:auto}#homeRoomGrid,.home-services,.home-security{display:none}</style><p>SIMULATED QA DATA · no connection to Home Assistant</p><button onclick="openRoomDetails('Kitchen')">Open sample room</button><div id="homeRoomGrid"></div><div class="home-services"><button class="salus-strip"></button></div><div class="home-security"><button class="compact-eufy"></button><button class="compact-pets"></button></div><script>
var haStates={},haVerified=true,haRequestId=1;const labels=['Wall','Ceiling','Cabinet','Breakfast bar','Pendant','Sink'];for(let i=0;i<labels.length;i++)haStates['light.kitchen_'+i]={entity_id:'light.kitchen_'+i,state:i%2?'on':'off',attributes:{friendly_name:'Kitchen '+labels[i],brightness:80+i*25,supported_color_modes:['brightness']}};
for(const [kind,value,unit] of [['temperature',20,'°C'],['humidity',60,'%']])haStates['sensor.kitchen_'+kind]={entity_id:'sensor.kitchen_'+kind,state:String(value),attributes:{friendly_name:'Kitchen '+kind,device_class:kind,unit_of_measurement:unit}};
haStates['select.kitchen_scene']={entity_id:'select.kitchen_scene',state:'Natural light',attributes:{friendly_name:'Kitchen Scene',options:['Bright','Read','Relax','Natural light','Nightlight','Concentrate','Dimmed','Energise']}};
var haSocket=new EventTarget();haSocket.readyState=1;haSocket.send=raw=>{const c=JSON.parse(raw);let result={};if(c.type.startsWith('config/'))result=[];if(c.type==='history/history_during_period'||c.type==='recorder/statistics_during_period'){const id=(c.entity_ids||c.statistic_ids)[0],humidity=id.includes('humidity'),start=Date.parse(c.start_time),end=Date.parse(c.end_time);result={[id]:Array.from({length:40},(_,i)=>{const t=start+(end-start)*i/39,v=(humidity?58:20)+Math.sin(i/4)*(humidity?7:1.8);return {state:String(v),last_updated:new Date(t).toISOString(),start:t,mean:v}})}}setTimeout(()=>haSocket.dispatchEvent(new MessageEvent('message',{data:JSON.stringify({id:c.id,type:'result',success:c.type!=='call_service',result,error:{message:'QA preview: device commands are disabled'}})})),10)};
</script><script src="../room-controls.js?v=4"></script><script>openRoomDetails('Kitchen')</script></html>
