<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kia · simulated QA</title><link rel="stylesheet" href="../home-screens.css?v=20"><style>body{margin:0;background:#101c2e;color:#eef5ff;font:14px system-ui}button{cursor:pointer}#kia{display:none}</style><p>SIMULATED QA DATA · no vehicle connection</p><button id="open">Open Kia</button><section id="kia"></section><script src="../kia-controls.js?v=1"></script><script>
var haSocket={};const states={},registry=[];function put(id,state,attributes={}){states[id]={entity_id:id,state,attributes:{friendly_name:'Sorento '+id.split('.').at(-1).replaceAll('_',' '),...attributes}};registry.push({entity_id:id,platform:'kia_uvo',device_id:'simulated'})}
put('sensor.total_driving_range','230',{unit_of_measurement:'mi'});put('sensor.fuel_level','46',{unit_of_measurement:'%'});put('sensor.odometer','31000',{unit_of_measurement:'mi'});put('sensor.car_battery','65',{unit_of_measurement:'%'});put('sensor.last_updated_at',new Date(Date.now()-15*60000).toISOString(),{device_class:'timestamp'});put('lock.door_lock','locked');put('binary_sensor.engine','off');for(const name of ['front_left_door','front_right_door','back_left_door','back_right_door','front_left_window','front_right_window'])put('binary_sensor.'+name,'off',{device_class:name.endsWith('door')?'door':'window'});for(const name of ['force_refresh','close_all_windows','open_all_windows','vent_all_windows','start_valet_mode','stop_valet_mode'])put('button.'+name,'unknown');put('climate.climate_control','off',{temperature:21,min_temp:14,max_temp:30,target_temp_step:0.5});
const services={kia_uvo:{start_climate:{fields:{device_id:{},climate:{},temperature:{selector:{number:{min:16,max:85}}},duration:{selector:{number:{min:1,max:30}}},defrost:{},heating:{selector:{select:{options:[{value:'0',label:'Off'},{value:'4',label:'Side and rear defroster'},{value:'1',label:'Steering wheel (some EU models), side and rear defroster'},{value:'2',label:'Rear window only'}]}}}},stop_climate:{}}};
const panel=createKiaPanel({card:document.getElementById('kia'),states:()=>states,connected:()=>true,request:async c=>{if(c.type==='config/entity_registry/list')return registry;if(c.type==='config/device_registry/list')return [{id:'simulated',name:'Sorento',model:'Sorento'}];if(c.type==='get_services')return services;if(c.type==='get_config')return {unit_system:{temperature:'°C'}};if(c.type==='get_states')return Object.values(states);throw Error('QA preview: vehicle commands are disabled')}});document.getElementById('open').onclick=()=>panel.open();panel.open();
</script></html>
