<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kia · simulated QA</title><link rel="stylesheet" href="../home-screens.css?v=25"><style>body{margin:0;background:#101c2e;color:#eef5ff;font:14px system-ui}button{cursor:pointer}#kia{display:none}</style><p>SIMULATED QA DATA · no vehicle connection</p><button id="open">Open Kia</button><section id="kia"></section><script src="../kia-refresh.js?v=1"></script><script src="../kia-controls.js?v=6"></script><script>
var haSocket={};const states={},registry=[];function put(id,state,attributes={}){states[id]={entity_id:id,state,attributes:{friendly_name:'Sorento '+id.split('.').at(-1).replaceAll('_',' '),...attributes}};registry.push({entity_id:id,platform:'kia_uvo',device_id:'simulated'})}
put('sensor.total_driving_range','230',{unit_of_measurement:'mi'});put('sensor.fuel_level','46',{unit_of_measurement:'%'});put('sensor.odometer','26472.7739998409',{unit_of_measurement:'mi'});put('sensor.car_battery','65',{unit_of_measurement:'%'});put('sensor.last_updated_at',new Date(Date.now()-15*60000).toISOString(),{device_class:'timestamp'});put('lock.door_lock','locked');put('binary_sensor.engine','off');for(const name of ['front_left_door','front_right_door','back_left_door','back_right_door','front_left_window','front_right_window'])put('binary_sensor.'+name,'off',{device_class:name.endsWith('door')?'door':'window'});for(const name of ['force_refresh','close_all_windows','open_all_windows','vent_all_windows','start_valet_mode','stop_valet_mode'])put('button.'+name,'unknown');put('climate.climate_control','off',{temperature:21,min_temp:14,max_temp:30,target_temp_step:0.5});

for(const n of ['back_left_window','back_right_window','hood','trunk','sunroof'])put('binary_sensor.'+n,'off',{device_class:'opening'});
for(const n of ['brake_fluid_warning','washer_fluid_warning','smart_key_battery_warning','tire_pressure_warning','front_left_lamp_fault','front_right_lamp_fault','rear_left_lamp_fault','rear_right_lamp_fault','headlamp_left_low_fault','headlamp_right_low_fault','headlamp_right_high_fault'])put('binary_sensor.'+n,n==='washer_fluid_warning'?'on':'off',{device_class:'problem'});
for(const n of ['air_conditioner','back_window_heater','defrost','steering_wheel_heater','front_left_seat','front_right_seat','rear_left_seat','rear_right_seat','charging','plugged_in','fuel_level_is_low'])put('binary_sensor.'+n,'off');
for(const n of ['fuel_driving_range','ev_driving_range','next_service_distance','last_service_distance','dtc_count','ev_battery','charging_power','charge_limit_ac','charge_limit_dc','outside_temperature','tire_pressure_front_left','tire_pressure_front_right','tire_pressure_rear_left','tire_pressure_rear_right'])put('sensor.'+n,'0');
const services={kia_uvo:{start_climate:{fields:{device_id:{},climate:{},temperature:{selector:{number:{min:16,max:85}}},duration:{selector:{number:{min:1,max:30}}},defrost:{},heating:{selector:{select:{options:[{value:'0',label:'Off'},{value:'4',label:'Side and rear defroster'},{value:'1',label:'Steering wheel (some EU models), side and rear defroster'},{value:'2',label:'Rear window only'}]}}}}},stop_climate:{}}};
const panel=createKiaPanel({card:document.getElementById('kia'),states:()=>states,connected:()=>true,request:async c=>{if(c.type==='config/entity_registry/list')return registry;if(c.type==='config/device_registry/list')return [{id:'simulated',name:'Sorento',model:'Sorento'}];if(c.type==='get_services')return services;if(c.type==='get_config')return {unit_system:{temperature:'°C'}};if(c.type==='get_states')return Object.values(states);throw Error('QA preview: vehicle commands are disabled')}});document.getElementById('open').onclick=()=>panel.open();panel.open();
</script></html>
