<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home layout checks</title><style>body{margin:0;background:#101c2e;color:white;font:13px system-ui}header{display:flex;gap:8px;padding:8px;flex-wrap:wrap}button,select{padding:6px;background:#29435f;color:white;border:1px solid #7289a1;border-radius:5px}#stage{position:relative;overflow:auto;height:calc(100dvh - 52px)}iframe{border:0;transform-origin:top left}output{padding:6px}</style><header><label>Viewport <select id="size"><option value="1280,800">Tablet landscape</option><option value="800,1280">Tablet portrait</option><option value="915,412">Phone landscape</option><option value="412,915">Phone portrait</option><option value="1920,1080">TV</option></select></label><button id="rotate">Rotate</button><button data-screen="launcher">Launcher</button><button data-screen="home">Smart Home</button><button data-screen="family">Family</button><button id="measure">Check fit</button><output id="result"></output></header><div id="stage"><iframe title="App preview" src="../index.html"></iframe></div><script>
const frame=document.querySelector('iframe'),size=document.getElementById('size'),stage=document.getElementById('stage');let w=1280,h=800;function fit(){[w,h]=size.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(stage.clientWidth/w,stage.clientHeight/h,1)+')'}size.onchange=fit;window.onresize=fit;fit();document.getElementById('rotate').onclick=()=>{const swapped=h+','+w;const option=[...size.options].find(o=>o.value===swapped);if(option)size.value=swapped;fit()};document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>frame.contentWindow.navigateHome(b.dataset.screen));document.getElementById('measure').onclick=()=>{const doc=frame.contentDocument,root=doc.body.dataset.homeScreen==='launcher'?doc.querySelector('main.shell'):doc.querySelector('#dashboardPage');const r=root.getBoundingClientRect();const grid=doc.querySelector('#familyMiniGrid');document.getElementById('result').textContent=JSON.stringify({width:w,height:h,screen:doc.body.dataset.homeScreen,pageFits:r.bottom<=h+1&&doc.documentElement.scrollWidth<=w+1,plannerRows:grid.querySelectorAll('.planner-row:not(.planner-head)').length,plannerFits:grid.scrollHeight<=grid.clientHeight+1,cardsFit:[...doc.querySelectorAll(".family-sections>.family-section")].every(e=>{const a=e.getBoundingClientRect(),p=e.parentElement.getBoundingClientRect();return a.top>=p.top-1&&a.bottom<=p.bottom+1&&a.left>=p.left-1&&a.right<=p.right+1})})};
</script></html>
