name: Refresh official weather warnings
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-weather-warnings.py', '.github/workflows/weather-warnings.yml']
permissions:
  contents: write
concurrency:
  group: weather-warning-data
  cancel-in-progress: false
jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Met Office RSS
        run: python scripts/fetch-weather-warnings.py
      - name: Publish isolated warning data branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin weather-warning-data; then
            git fetch origin weather-warning-data
            git checkout -B weather-warning-data FETCH_HEAD
          else
            git checkout --orphan weather-warning-data
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/weather-warnings.json" weather-warnings.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-warnings.json
          git commit -m "Refresh official warning feed"
          git push origin HEAD:weather-warning-data
