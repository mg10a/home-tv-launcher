name: Build Halo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'home-screens.*'
      - 'family-calendar.*'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check production dashboard
        run: node --test tests/production-launcher.test.cjs tests/vtech-app-shortcut.test.cjs
      - name: Build debug APK
        run: gradle -Pandroid.useAndroidX=true :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-4.1.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build safe side-by-side VTech preview APK
        run: gradle -Pandroid.useAndroidX=true -PhaloPreview=true :app:assembleDebug --no-daemon
      - name: Verify preview has a separate Android application ID
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='uk.homecinema.launcher.vtechpreview'"
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-VTech-Preview-4.1.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
