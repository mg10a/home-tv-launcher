name: Build and publish Samsung Food image
on:
  push:
    branches: [main]
    paths: ['samsung_food_bridge/**', '.github/workflows/samsung-food-image.yml']
  pull_request:
    paths: ['samsung_food_bridge/**', '.github/workflows/samsung-food-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: samsung-food-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mg10a/halo-samsung-food
  RELEASE: '0.3.1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native image
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/mg10a/home-tv-launcher \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version=$RELEASE \
            -t "$IMAGE:$RELEASE-${{ matrix.arch }}" samsung_food_bridge
      - name: Verify browser and persistent profile offline
        run: |
          docker run --rm --network none --entrypoint python \
            -e PYTHONPATH=/app \
            -v "$PWD/samsung_food_bridge/test-image.py:/tmp/test-image.py:ro" \
            "$IMAGE:$RELEASE-${{ matrix.arch }}" /tmp/test-image.py
          docker image inspect "$IMAGE:$RELEASE-${{ matrix.arch }}" --format 'Image bytes: {{.Size}}'
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:$RELEASE-${{ matrix.arch }}"
  manifest:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish both tested architectures
        run: |
          docker buildx imagetools create -t "$IMAGE:$RELEASE" \
            "$IMAGE:$RELEASE-amd64" "$IMAGE:$RELEASE-aarch64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE"
