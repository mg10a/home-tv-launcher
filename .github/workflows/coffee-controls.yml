name: Device dashboard controls
on:
  push:
    branches: [main]
    paths:
      - 'kia-controls.js'
      - 'kia-refresh.js'
      - 'tests/kia-refresh.test.mjs'
      - 'location-map.js'
      - 'tests/location-map.test.mjs'
      - 'tests/kia-controls.test.mjs'
      - 'coffee-controls.js'
      - 'home-screens.css'
      - 'viewport-fit.css'
      - 'tests/viewport-fit.test.cjs'
      - 'pet-timeline.js'
      - 'tests/pet-timeline.test.cjs'
      - 'tests/coffee-layout.test.cjs'
      - 'room-controls.js'
      - 'tests/coffee-controls.test.mjs'
      - 'tests/coffee-confirmation.test.mjs'
      - 'tests/room-controls.test.mjs'
      - '.github/workflows/coffee-controls.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts happy-dom@21.0.4 playwright@1.62.1
      - run: node tests/kia-refresh.test.mjs
      - run: node tests/location-map.test.mjs
      - run: node --check kia-controls.js
      - run: node tests/kia-controls.test.mjs
      - run: node --check coffee-controls.js
      - run: node tests/coffee-controls.test.mjs
      - run: node tests/coffee-confirmation.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/coffee-layout.test.cjs
      - run: node --test tests/pet-timeline.test.cjs
      - run: node tests/viewport-fit.test.cjs
      - run: node tests/room-controls.test.mjs
