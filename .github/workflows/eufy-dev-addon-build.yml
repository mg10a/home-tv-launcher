name: Build Eufy DEV Home Assistant add-on
on:
  push:
    branches: [main]
    paths:
      - 'eufy_bridge_dev/**'
      - '.github/workflows/eufy-dev-addon-build.yml'
  workflow_dispatch:
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable HA add-on image
        run: docker build --progress=plain -t eufy-bridge-dev:ci eufy_bridge_dev
      - name: Assert FFmpeg 7.1 and real paced HEVC to H.264 compatibility
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/eufy_bridge_dev/test-hevc-decoder.sh:/tmp/test-hevc-decoder.sh:ro" \
            eufy-bridge-dev:ci /tmp/test-hevc-decoder.sh
      - name: Exercise decoder stall recovery against compiled bridge
        run: |
          docker run --rm --entrypoint node \
            -v "$PWD/eufy_bridge_dev/test-stall-recovery.mjs:/app/test-stall-recovery.mjs:ro" \
            eufy-bridge-dev:ci /app/test-stall-recovery.mjs
      - name: Assert authenticated DEV HTTP bridge identity and restart stability
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/eufy_bridge_dev/test-bridge-identity.sh:/tmp/test-bridge-identity.sh:ro" \
            eufy-bridge-dev:ci /tmp/test-bridge-identity.sh
  docker-build-aarch64:
    # Native ARM64 runner: Home Assistant Yellow uses this architecture.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build actual ARM64 Home Assistant DEV add-on
        run: |
          docker build --platform linux/arm64 --progress=plain \
            -t eufy-bridge-dev:arm64 eufy_bridge_dev
      - name: HEVC decoder smoke test on ARM64
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh \
            -v "$PWD/eufy_bridge_dev/test-hevc-decoder.sh:/tmp/test-hevc-decoder.sh:ro" \
            eufy-bridge-dev:arm64 /tmp/test-hevc-decoder.sh
      - name: Verify stalled encoder recovery on ARM64
        run: |
          docker run --rm --platform linux/arm64 --entrypoint node \
            -v "$PWD/eufy_bridge_dev/test-stall-recovery.mjs:/app/test-stall-recovery.mjs:ro" \
            eufy-bridge-dev:arm64 /app/test-stall-recovery.mjs
      - name: Assert ARM64 DEV bridge identity and restart stability
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh \
            -v "$PWD/eufy_bridge_dev/test-bridge-identity.sh:/tmp/test-bridge-identity.sh:ro" \
            eufy-bridge-dev:arm64 /tmp/test-bridge-identity.sh
