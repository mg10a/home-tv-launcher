name: Validate DEV Eufy dashboard
on:
  push:
    branches: [main]
    paths:
      - 'dev/index.html'
      - 'tests/eufy-dashboard-dev.test.mjs'
      - '.github/workflows/validate-eufy-dashboard.yml'
  workflow_dispatch:
jobs:
  dev-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise DEV launcher inline JS and Eufy recording/live fixtures
        run: node tests/eufy-dashboard-dev.test.mjs
