name: Build Halo VTech connector
on:
  workflow_dispatch:
  push:
    paths:
      - 'vtech_baby/**'
      - '.github/workflows/vtech-baby.yml'
  pull_request:
    paths:
      - 'vtech_baby/**'
      - '.github/workflows/vtech-baby.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s vtech_baby/tests -v
      - run: python -m compileall -q vtech_baby/custom_components
      - run: python vtech_baby/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: halo-vtech-experimental
          path: vtech_baby/dist/*.zip
