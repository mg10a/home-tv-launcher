name: Build Home TV DEV Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-dev-app/**'
      - '.github/workflows/build-home-tv-android-dev.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build installable debug APK
        working-directory: android-dev-app
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Home-TV-DEV-Android-APK
          path: android-dev-app/app/build/outputs/apk/debug/app-debug.apk
